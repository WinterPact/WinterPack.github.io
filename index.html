<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Acceso a Winter [ Pact ].">
    <title>Acceso | Winter [ Pact ]</title>
    <link rel="icon" type="image/svg+xml" href="copo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-panel" aria-labelledby="login-title">
            <div class="login-emblem" aria-hidden="true">W</div>
            <a class="brand login-brand" href="index.html"><span>WINTER <b>[ PACT ]</b></span></a>
            <div id="access-choice">
                <p class="section-label">Acceso restringido</p>
                <h2 id="login-title">Entra al<br><strong>pacto.</strong></h2>
                <p class="login-copy">Elige cómo quieres entrar a Winter [ Pact ].</p>
                <div class="login-actions">
                    <button class="button button-primary" id="visitor-access" type="button">Entrar como visitante <span>↗</span></button>
                    <button class="button button-outline" id="member-access" type="button">Entrar como miembro <span>→</span></button>
                </div>
            </div>
            <form class="member-login-form" id="member-login-form" hidden>
                <button class="back-link login-back" id="back-to-choice" type="button">← Volver</button>
                <p class="section-label">Acceso de miembro</p>
                <h2>Identificación<br><strong>Winter.</strong></h2>
                <label for="member-user">Usuario</label>
                <input id="member-user" name="username" type="text" autocomplete="username" required>
                <label for="member-password">Contraseña</label>
                <input id="member-password" name="password" type="password" autocomplete="current-password" required>
                <button class="button button-primary" type="submit">Entrar al pacto <span>↗</span></button>
                <p class="form-status" id="login-status" aria-live="polite"></p>
                <div class="login-help" id="login-help" hidden role="alert">Si olvidaste la contraseña, puedes encontrarla en el apartado de anuncios de nuestro Discord.</div>
            </form>
        </section>
    </main>
    <script src="auth.js"></script>
</body>
</html>
